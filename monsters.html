<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bestiary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Specimen bench, darker: the rack lists every monster by its kind; the stage shows one, a whole kind, or the whole hall. */
:root{color-scheme:dark;--bench:#151b1d;--panel:#1e2629;--panel-hi:#2a3539;--line:#36454a;--bone:#e7dfcd;--dim:#97a5a1;--blood:#c2412f;--ember:#e0913a;
  --display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
html,body{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bench);color:var(--bone);font:14px/1.4 var(--display);overflow:hidden}
#app{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:100%}
#rack{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 14px 20px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}.sub{color:var(--dim);font-size:12.5px}
h2{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 4px}
.list{display:flex;flex-direction:column;gap:2px}
.it{all:unset;box-sizing:border-box;cursor:pointer;padding:5px 8px;border-radius:4px;display:flex;justify-content:space-between;gap:6px;font-size:13.5px}
.it:hover{background:var(--panel-hi)}.it[aria-pressed=true]{background:var(--blood);color:#fff}
.it small{font:400 11px var(--mono);opacity:.75}
details summary{cursor:pointer;font:700 13.5px var(--display);padding:4px 0}
details summary small{font:400 11px var(--mono);color:var(--dim);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
button,select{font:500 12.5px var(--display);color:var(--bone);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 9px;cursor:pointer;min-height:30px}
button:hover{background:var(--panel-hi)}button[aria-pressed=true]{background:var(--ember);border-color:var(--ember);color:#24150a}
:focus-visible{outline:2px solid var(--ember);outline-offset:1px}
#stage{position:relative;min-width:0;min-height:0;background:#20292c}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:12px;top:10px;font:500 12.5px var(--mono);color:#fff;text-shadow:0 1px 2px #000;pointer-events:none;max-width:60%}
#modes{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 14px var(--mono);pointer-events:none;text-shadow:0 1px 3px #000}
#status[hidden]{display:none}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#tags div{position:absolute;transform:translate(-50%,0);font:500 11px var(--mono);color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;pointer-events:auto;cursor:pointer}
#transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px 12px;background:var(--panel);border-top:1px solid var(--line)}
#scrub{flex:1 1 160px;accent-color:var(--ember)}
#frame{font:500 12.5px var(--mono);min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
label.sel{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim)}
@media (max-width:760px){body{overflow:auto}#app{display:flex;flex-direction:column;height:auto}#stage{height:60vh;order:1;flex:none}#transport{order:2}#rack{order:3;border-right:0;overflow:visible}}
</style>
<div id="app">
  <aside id="rack">
    <div><h1>Bestiary</h1><div class="sub" id="meta">Loading the roster…</div></div>
    <div><h2>Palette</h2><div class="chips" id="pals"></div></div>
    <div><h2>Moves</h2><div class="list" id="clips"></div></div>
    <div><h2>Monsters</h2><div id="kinds"></div></div>
  </aside>
  <main id="stage">
    <div id="tags"></div>
    <div id="status">Loading…</div>
    <div id="hud"></div>
    <div id="modes"></div>
  </main>
  <div id="transport">
    <button id="play">Pause</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Clip timeline">
    <span id="frame">0.00 s</span>
    <label class="sel">Speed <select id="rate"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option></select></label>
    <button id="cycle" aria-pressed="true">Cycle moves</button>
    <button id="skel" aria-pressed="false">Skeleton</button>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

// Palettes: hue turn, saturation, value and a tint, applied after the texture.
const palU={hue:{value:0},sat:{value:1},val:{value:1},tint:{value:new THREE.Color(1,1,1)},tamt:{value:0}};

  m.onBeforeCompile=s=>{Object.assign(s.uniforms,m.userData.pal);
    s.fragmentShader=s.fragmentShader.replace('#include <common>',`#include <common>
uniform float hue,sat,val,tamt;uniform vec3 tint;

}
function setPal(inst,p){inst.mats.forEach(m=>{const u=m.userData.pal;u.hue.value=p.hue||0;u.sat.value=p.sat??1;u.val.value=p.val??1;u.tamt.value=p.tamt||0;u.tint.value.setRGB(...(p.tint||[1,1,1]))})}

// Fire, poison, rot: sprites thrown from the mouth while a breath move plays.
const BREATH={fire:[[1,.72,.2],[1,.36,.03],[.7,.07,.01],[.11,.09,.08]],poison:[[.55,1,.25],[.25,.7,.08],[.08,.12,.05]],rot:[[.5,1,.85],[.2,1,.75],[.05,.55,.45],[.05,.09,.08]],acid:[[.45,.8,.08],[.3,.6,.02],[.08,.14,.01]],necro:[[.6,.2,1],[.42,.08,.9],[.15,.75,.35],[.04,.03,.06]]};

// Loading and posing.
const L=new GLTFLoader(),cache={};

// Modes: one monster, a whole kind side by side, or the whole hall.
let mode=Q.get('mode')||'one',focus=Q.get('id')&&ROSTER[Q.get('id')]?Q.get('id'):ids[0],pal='Base',clip=Q.get('clip')||'idle',playing=true,rate=1,cycle=!Q.has('nocycle'),insts=[],skel=null,busy=0;
async function show(){

  const big=insts.reduce((m,i)=>Math.max(m,i.meta.height),0);
  if(mode==='one'){const h=big;ctl.target.set(0,h*.5,0);cam.position.set(h*1.1,h*.75,h*1.9);insts[0].holder.position.set(0,0,0)}
  else{const span=Math.max(maxX,-z+4);ctl.target.set(0,1.2,0);cam.position.set(0,span*.45,span*.85)}
  ctl.update();
  if(mode==='one'){skel=new THREE.SkeletonHelper(insts[0].root);skel.visible=$('skel').getAttribute('aria-pressed')==='true';scene.add(skel)}
  buildClips();buildKinds();$('status').hidden=true;hud();
}
function hud(){const i=insts[0];if(!i)return;const m=i.meta;
  $('hud').textContent=mode==='one'?`${m.name||m.id} · ${m.group} · ${m.height} m · ${i.names.length} moves · ${LABEL[i.clip]||i.clip}`:`${insts.length} monsters · ${LABEL[clip]||clip} · ${pal}`}
function buildClips(){const box=$('clips');box.innerHTML='';
  const names=mode==='one'?insts[0].names:ORDER.filter(n=>insts.some(i=>i.acts[n]));
  names.forEach(n=>{const b=document.createElement('button');b.className='it';b.setAttribute('aria-pressed',n===(mode==='one'?insts[0].clip:clip));
    const d=mode==='one'?insts[0].acts[n].getClip().duration.toFixed(2)+'s':insts.filter(i=>i.acts[n]).length+'';
    b.innerHTML=`<span>${LABEL[n]||n}</span><small>${d}</small>`;b.onclick=()=>{clip=n;insts.forEach(i=>play(i,i.acts[n]?n:'idle'));cycleT=0;buildClips();hud()};box.append(b)})}
function buildKinds(){const box=$('kinds');if(box.childElementCount)return refreshKinds();
  Object.entries(kinds).forEach(([k,list])=>{const d=document.createElement('details');d.open=list.includes(focus);
    d.innerHTML=`<summary>${k}<small>${list.length}</small></summary>`;const l=document.createElement('div');l.className='list';
    list.forEach(id=>{const b=document.createElement('button');b.className='it';b.dataset.id=id;b.innerHTML=`<span>${ROSTER[id].name||id}</span><small>${ROSTER[id].height}m</small>`;
      b.onclick=()=>{focus=id;mode='one';setModes();show()};l.append(b)});d.append(l);box.append(d)});refreshKinds()}
function refreshKinds(){document.querySelectorAll('#kinds .it').forEach(b=>b.setAttribute('aria-pressed',mode==='one'&&b.dataset.id===focus))}
function setModes(){$('modes').innerHTML='';[['one','One'],['kind','Whole kind'],['hall','Whole hall']].forEach(([m,t])=>{const b=document.createElement('button');b.textContent=t;b.setAttribute('aria-pressed',m===mode);b.onclick=()=>{mode=m;setModes();show()};$('modes').append(b)})}
Object.keys(PALS).forEach(p=>{const b=document.createElement('button');b.textContent=p;b.setAttribute('aria-pressed',p===pal);b.onclick=()=>{pal=p;insts.forEach(i=>setPal(i,PALS[p]));document.querySelectorAll('#pals button').forEach(x=>x.setAttribute('aria-pressed',x.textContent===p));hud()};$('pals').append(b)});
$('meta').textContent=`${ids.length} monsters in ${Object.keys(kinds).length} kinds · drag to orbit`;
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};
$('rate').onchange=e=>rate=+e.target.value;
$('cycle').onclick=()=>{cycle=!cycle;$('cycle').setAttribute('aria-pressed',cycle)};
$('skel').onclick=()=>{const v=$('skel').getAttribute('aria-pressed')!=='true';$('skel').setAttribute('aria-pressed',v);if(skel)skel.visible=v};
$('scrub').oninput=e=>{playing=false;$('play').textContent='Play';const i=insts[0];if(i?.cur){i.cur.time=e.target.value/1000*i.cur.getClip().duration;i.mixer.update(0)}};
let cycleT=0;const clock=new THREE.Clock();
function tick(dt){
  ctl.update();
  for(const i of insts){if(!i.cur)continue;const d=playing?dt*rate:0;
    // Mannequins move like stop-motion: the pose only changes a few times a second.
    if(i.meta.stutter){i.stepT+=d;const st=1/i.meta.stutter;if(i.stepT>=st){i.mixer.update(i.stepT);i.stepT=0}}else i.mixer.update(d);
    if(i.meta.hover){const want=(i.meta.hover[i.clip]||0)*i.meta.height;i.hy=(i.hy||0)+(want-(i.hy||0))*Math.min(1,d*2.5);i.root.position.y=i.baseY+i.hy}
    i.t+=d;const dur=i.cur.getClip().duration;
    const bw=i.meta.breathWin||[.22,.8];if(i.meta.breath&&/^breath/.test(i.clip)&&i.cur.time>dur*bw[0]&&i.cur.time<dur*bw[1])emit(i,d);
    if(i.hand&&CAST.test(i.clip)&&i.cur.time>dur*.3&&i.cur.time<dur*.8)emit(i,d,{bone:i.hand,kind:'necro'});
    if(mode!=='one'&&cycle&&ONCE(i.clip)&&i.t>dur+.6)play(i,'idle');}
  if(mode==='one'&&cycle&&playing){const i=insts[0];if(i?.cur){const dur=i.cur.getClip().duration;
    if(i.t>Math.max(dur,ONCE(i.clip)?0:4)+.4){const k=i.names.indexOf(i.clip);play(i,i.names[(k+1)%i.names.length]);buildClips();hud()}}}
  stepParts(dt*(playing?rate:0));
  const i=insts[0];if(i?.cur){const f=i.cur.time/i.cur.getClip().duration;$('scrub').value=Math.round(f*1000);$('frame').textContent=i.cur.time.toFixed(2)+' s'}
  if(mode!=='one'){const v=new THREE.Vector3();for(const i of insts){if(!i.tag)continue;v.copy(i.holder.position);v.y=i.meta.height*1.05;v.project(cam);
    const w=stage.clientWidth,h=stage.clientHeight;i.tag.style.left=(v.x*.5+.5)*w+'px';i.tag.style.top=(-v.y*.5+.5)*h+'px';i.tag.style.display=v.z<1?'':'none'}}
  R.render(scene,cam);
}
setModes();
if(Q.has('sheet')){
  // Contact sheets for review: each move sampled at evenly spaced moments from a fixed camera.
  window.sheet=async(id,names,cols=6,view=[1.1,.75,1.9],W=220,H=260)=>{
    mode='one';focus=id;cycle=false;await show();const i=insts[0];names=names||i.names;
    const rows=names.length,C=document.createElement('canvas');C.width=cols*W+120;C.height=rows*H;const x=C.getContext('2d');x.fillStyle='#111';x.fillRect(0,0,C.width,C.height);
    R.setPixelRatio(1);R.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();const h=i.meta.height;
    names.forEach((n,r)=>{Object.values(i.acts).forEach(a=>a.stop());const a=i.acts[n];i.clip=n;a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true;const dur=a.getClip().duration;
      for(let c=0;c<cols;c++){const tt=dur*c/(cols-1)*.999;a.reset();a.setEffectiveWeight(1);a.play();a.time=tt;i.mixer.update(0);i.root.position.y=i.baseY+((i.meta.hover||{})[n]||0)*i.meta.height;
        const hv=((i.meta.hover||{})[n]||0)*h,cy=h*.5+hv;ctl.target.set(0,cy,0);cam.position.set(view[0]*h,view[1]*h+hv,view[2]*h);cam.lookAt(0,cy,0);
        parts.splice(0).forEach(p=>scene.remove(p));const bw=i.meta.breathWin||[.22,.8];if(i.meta.breath&&/^breath/.test(n)&&tt>dur*bw[0]&&tt<dur*bw[1])for(let k=0;k<30;k++){emit(i,1/30);stepParts(1/30)}
        if(i.hand&&CAST.test(n)&&tt>dur*.3&&tt<dur*.8)for(let k=0;k<20;k++){emit(i,1/30,{bone:i.hand,kind:'necro'});stepParts(1/30)}
        R.render(scene,cam);x.drawImage(R.domElement,120+c*W,r*H);x.fillStyle='#ccc';x.font='11px monospace';x.fillText(tt.toFixed(2)+'s',124+c*W,r*H+12)}
      x.fillStyle='#fff';x.font='bold 14px sans-serif';x.fillText(LABEL[n]||n,6,r*H+H/2);x.font='11px monospace';x.fillText(dur.toFixed(2)+'s',6,r*H+H/2+16)});
    return C.toDataURL('image/png');
  };
  window.ready=true;
}else{await show();R.setAnimationLoop(()=>tick(Math.min(clock.getDelta(),.05)))}
window.__bestiary={get insts(){return insts},show,play,ROSTER,scene,cam};
</script>

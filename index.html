<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0907">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bellmourn : Velscour's Throne</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" as="image" href="assets/title/blastorama.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/title/herrington.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/title/bellmourn.webp" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,600;1,600&family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="src/title.css">
<style>
  :root { --gold: #c9a35c; --gold-dim: #8c7344; --bone: #e9dfc9; --ink: #0b0907; --blood: #8e1a12; --blood-hi: #d23a22; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; font-family: Georgia, 'Times New Roman', serif; color: var(--bone); }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* The permission gate */
  #gate { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at 50% 35%, #2a1d12 0%, #0b0907 72%); z-index: 20; transition: opacity .7s; text-align: center; }
  #gate.clear { background: linear-gradient(180deg, rgba(11,9,7,.55), rgba(11,9,7,.15) 40%, rgba(11,9,7,.75)); }
  #gate.gone { opacity: 0; pointer-events: none; }
  h2 { margin: 2px 0 28px; font-size: clamp(14px, 2.4vw, 22px); letter-spacing: .34em; font-weight: normal; color: var(--bone); text-transform: uppercase; opacity: .85; }
  .card { max-width: 560px; width: 100%; padding: 20px 24px; background: rgba(0,0,0,.5); border: 1px solid var(--gold-dim); backdrop-filter: blur(3px); line-height: 1.55; font-size: 15.5px; }
  .card b { color: var(--gold); font-weight: normal; }
  .small { font-size: 13px; opacity: .72; margin-top: 10px; }
  button.big { margin-top: 18px; padding: 14px 42px; min-height: 48px; font: inherit; font-size: 17px; letter-spacing: .12em; color: #17110a; background: linear-gradient(180deg, #dcbb78, #a9853f); border: 1px solid #efd9a4; cursor: pointer; }
  button.big:hover { filter: brightness(1.1); }
  button.big:disabled { opacity: .45; cursor: default; }
  button.alt { margin: 18px 0 0 10px; padding: 14px 18px; min-height: 48px; font: inherit; font-size: 14px; color: var(--bone); background: transparent; border: 1px solid var(--gold-dim); cursor: pointer; }
  #bar { width: min(420px, 80vw); height: 6px; margin-top: 18px; background: rgba(255,255,255,.1); display: none; }
  #bar > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .15s; }
  #status { margin-top: 10px; min-height: 1.3em; font-size: 13px; opacity: .78; }
  #controls { margin-top: 14px; font-size: 13.5px; opacity: .85; line-height: 1.7; }
  kbd { padding: 1px 6px; border: 1px solid var(--gold-dim); font: inherit; font-size: 12px; color: var(--gold); }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
  #cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); opacity: .75; transition: opacity .15s, transform .08s; }
  #cross::before, #cross::after { content: ''; position: absolute; left: 50%; top: 50%; width: 22px; height: 1.5px; background: var(--bone); box-shadow: 0 0 2px #000; }
  #cross::before { transform: translate(-50%, -50%) rotate(45deg); }
  #cross::after { transform: translate(-50%, -50%) rotate(-45deg); }
  #cross.wound { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
  #cross.wound::before, #cross.wound::after { background: var(--blood-hi); box-shadow: 0 0 6px var(--blood-hi); }
  #cross.hit { transform: translate(-50%, -50%) scale(1.5); }
  #cross.hit::before, #cross.hit::after { background: var(--blood-hi); }
  #vitals { position: absolute; left: calc(26px + env(safe-area-inset-left)); bottom: calc(26px + env(safe-area-inset-bottom)); width: min(290px, 44vw); }
  .label { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .78; margin-bottom: 4px; text-shadow: 0 1px 3px #000; }
  .meter { height: 8px; background: rgba(0,0,0,.6); border: 1px solid rgba(201,163,92,.55); overflow: hidden; }
  .meter > i { display: block; height: 100%; width: 100%; background: linear-gradient(180deg, #b82a1d, #6d120b); transform-origin: 0 50%; will-change: transform; transition: transform .12s; }
  #clock { position: absolute; left: calc(20px + env(safe-area-inset-left)); top: calc(18px + env(safe-area-inset-top)); width: 76px; text-align: center; filter: drop-shadow(0 2px 5px rgba(0,0,0,.7)); }
  #clock svg { display: block; width: 100%; height: auto; }
  #clock text { font: 700 6.6px Georgia, 'Times New Roman', serif; fill: #18120c; text-anchor: middle; }
  #clock .phase { margin-top: 3px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #cdbf9f; text-shadow: 0 1px 3px #000; }
  #foe { position: absolute; top: calc(18px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(520px, 62vw); padding: 6px 12px 7px; text-align: center; opacity: 0; transition: opacity .4s; background: rgba(8,6,4,.5); }
  #foe .name { font-size: 15px; letter-spacing: .24em; color: var(--gold); margin-bottom: 5px; text-shadow: 0 1px 4px #000; }
  #foeHp > i { background: linear-gradient(180deg, #a0231a, #5b0e08); }
  #foeArmor { height: 3px; margin-top: 3px; background: rgba(0,0,0,.6); }
  #foeArmor > i { display: block; height: 100%; width: 100%; background: #9aa0a6; transform-origin: 0 50%; will-change: transform; transition: transform .2s; }
  #bleed { margin-top: 5px; font-size: 12px; letter-spacing: .16em; color: var(--blood-hi); min-height: 1.3em; text-shadow: 0 1px 3px #000; }
  #msg { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: clamp(30px, 6vw, 62px); letter-spacing: .1em; color: var(--gold); text-shadow: 0 2px 22px #000; opacity: 0; transition: opacity .8s; }
  #msg small { display: block; margin-top: 12px; font-size: 16px; letter-spacing: .2em; color: var(--bone); }
  #tip { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); max-width: min(620px, 64vw); text-align: center; font-size: 15px; line-height: 1.4; letter-spacing: .03em; color: var(--bone); background: rgba(8,6,4,.62); padding: 7px 14px; opacity: 0; transition: opacity .5s; }
  #stam { height: 4px; margin-top: 3px; background: rgba(0,0,0,.6); overflow: hidden; }
  #stam > i { display: block; height: 100%; width: 100%; background: #c9b478; transform-origin: 0 50%; will-change: transform; transition: transform .08s; }
  #debug { position: absolute; right: 12px; top: 200px; font: 12px/1.45 ui-monospace, Consolas, monospace; text-align: right; color: #e6e0d0; text-shadow: 0 1px 2px #000; white-space: pre; display: none; }
  #take { position: absolute; left: 50%; top: 70%; transform: translateX(-50%); max-width: 70vw; text-align: center; font-size: 15px; letter-spacing: .03em; background: rgba(8,6,4,.62); padding: 6px 14px; display: none; }
  /* The map */
  #mapMini { position: absolute; right: calc(20px + env(safe-area-inset-right)); top: calc(18px + env(safe-area-inset-top)); width: 168px; height: 168px; border-radius: 50%; box-shadow: 0 2px 10px rgba(0,0,0,.7); opacity: .92; display: none; }
  #mapBig { position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 8px; background: rgba(4,3,2,.55); pointer-events: none; }
  #mapBig.open { display: flex; }
  #mapBigCanvas { width: min(86vh, 92vw); height: min(86vh, 92vw); border: 1px solid var(--gold-dim); opacity: .9; }
  .mapKey { font-size: 12px; letter-spacing: .1em; color: var(--bone); text-shadow: 0 1px 3px #000; }
  .mapKey span { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1px solid #000; vertical-align: -1px; }
  .mapKey .me { background: #f1d68a; } .mapKey .foe { background: #d8402c; } .mapKey .kin { background: #e9dfc9; }
  .mapKey b { color: var(--gold); }
  body.touch .mapKey .mapClose::after { content: 'AP'; }
  #pause { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,.55); z-index: 15; }

  /* Touch controls */
  #touch { position: fixed; inset: 0; z-index: 6; display: none; }
  .tbtn { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1.5px solid rgba(233,223,201,.55); background: rgba(10,8,6,.42); color: var(--bone); font-size: 12px; letter-spacing: .08em; }
  .tbtn.on, .tbtn:active { background: rgba(201,163,92,.45); }
  #bAttack { width: 92px; height: 92px; right: calc(26px + env(safe-area-inset-right)); bottom: calc(30px + env(safe-area-inset-bottom)); font-size: 13px; }
  #bWide { width: 66px; height: 66px; right: calc(204px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); display: none; }
  #bJump { width: 66px; height: 66px; right: calc(38px + env(safe-area-inset-right)); bottom: calc(132px + env(safe-area-inset-bottom)); }
  #bSprint { width: 56px; height: 56px; left: calc(30px + env(safe-area-inset-left)); bottom: calc(190px + env(safe-area-inset-bottom)); }
  #bDodge { width: 66px; height: 66px; right: calc(128px + env(safe-area-inset-right)); bottom: calc(112px + env(safe-area-inset-bottom)); }
  #bPause { width: 40px; height: 40px; left: 50%; margin-left: -20px; bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 15px; letter-spacing: 0; }
  #bPack { width: 56px; height: 56px; left: calc(30px + env(safe-area-inset-left)); bottom: calc(256px + env(safe-area-inset-bottom)); }
  #bMap { width: 40px; height: 40px; left: 50%; margin-left: 30px; bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 10px; letter-spacing: .04em; }
  #bTake { width: 66px; height: 66px; right: calc(218px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); display: none; background: rgba(201,163,92,.32); }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0b0907; z-index: 30; font-size: 18px; text-align: center; padding: 30px; color: var(--gold); }
  @media (orientation: portrait) { body.touch.playing #rotate { display: flex; } }
  #stick { position: absolute; width: 130px; height: 130px; border-radius: 50%; border: 1.5px solid rgba(233,223,201,.4); background: rgba(10,8,6,.2); display: none; }
  #nub { position: absolute; left: 41px; top: 41px; width: 48px; height: 48px; border-radius: 50%; background: rgba(233,223,201,.45); }
  body.touch #vitals { bottom: auto; top: calc(14px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); width: 28vw; }
  body.touch #clock { left: auto; right: calc(14px + env(safe-area-inset-right)); top: calc(76px + env(safe-area-inset-top)); width: 46px; }
  body.touch #mapMini { right: calc(70px + env(safe-area-inset-right)); top: calc(66px + env(safe-area-inset-top)); width: 96px; height: 96px; }
  body.touch #clock .phase { font-size: 9px; }
  body.touch #foe { top: calc(10px + env(safe-area-inset-top)); left: auto; right: calc(14px + env(safe-area-inset-right)); transform: none; width: 44vw; }

  /* The pack */
  #inv { --cell: min(calc((100vh - 96px) / 8), calc((100vw - 300px) / 12), 52px); position: fixed; inset: 0; z-index: 12; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(6,5,3,.5); padding: 6px; touch-action: none; }
  #invBody { display: flex; gap: 10px; align-items: stretch; }
  #inv .panel { background: rgba(11,9,7,.93); border: 1px solid var(--gold-dim); padding: 8px 10px 10px; }
  #inv .label { color: var(--gold); margin-bottom: 7px; opacity: 1; }
  #eqGrid { display: grid; grid-template-columns: repeat(3, calc(var(--cell) * 1.4)); grid-auto-rows: calc(var(--cell) * 1.36); gap: 3px;
    grid-template-areas: "shoulders head neck" "main chest off" "main skull ring1" "main legs ring2" "main feet ."; }
  #levelBox { position: absolute; left: 16px; bottom: 62px; width: 230px; text-align: left; color: #e8d9b0; font-size: 12px; letter-spacing: .08em; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #xpBar { height: 5px; margin-top: 2px; background: rgba(0,0,0,.55); border: 1px solid rgba(140,115,68,.6); }
  #xpBar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8a5cf0, #d6b4ff); }
  .slot { position: relative; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(140,115,68,.42); background: rgba(255,255,255,.025); min-width: 0; min-height: 0; overflow: hidden; }
  .slot span { font-size: 10.5px; letter-spacing: .1em; opacity: .42; text-transform: uppercase; }
  .slot.full { border-color: var(--rc); background: linear-gradient(0deg, rgba(0,0,0,.25), rgba(255,255,255,.05)); }
  .slot[data-slot="main"] { border-color: var(--gold-dim); }
  .slot[data-slot="main"].full { border-color: var(--rc); }
  #invStats { margin-top: 9px; width: calc(var(--cell) * 4.2 + 6px); font-size: 13px; line-height: 1.4; min-height: 3.6em; }
  #invStats b { font-weight: normal; color: var(--gold); }
  #packGrid { position: relative; width: calc(var(--pw) * var(--cell)); height: calc(var(--ph) * var(--cell)); outline: 1px solid rgba(140,115,68,.5);
    background-image: linear-gradient(rgba(140,115,68,.2) 1px, transparent 1px), linear-gradient(90deg, rgba(140,115,68,.2) 1px, transparent 1px); background-size: var(--cell) var(--cell); }
  #packGrid .it, #packHover { position: absolute; left: calc(var(--x) * var(--cell)); top: calc(var(--y) * var(--cell)); width: calc(var(--w) * var(--cell)); height: calc(var(--h) * var(--cell)); }
  #packGrid .it { display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--rc) 9%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rc) 42%, transparent); }
  #packGrid .it:hover { background: color-mix(in srgb, var(--rc) 22%, transparent); }
  #packHover { display: none; pointer-events: none; z-index: 2; }
  #packHover.ok { background: rgba(120,190,120,.26); box-shadow: inset 0 0 0 1px rgba(150,220,150,.7); }
  #packHover.bad { background: rgba(200,60,50,.26); box-shadow: inset 0 0 0 1px rgba(230,90,70,.7); }
  .ico { position: relative; height: 100%; aspect-ratio: 1 / 4; background-size: 100% 100%; background-repeat: no-repeat; flex: none; pointer-events: none; }
  .sock { position: absolute; width: 22%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.62); border: 1px solid rgba(233,223,201,.75); }
  .gem { width: 82%; height: 82%; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.8)); }
  #invCarry { position: fixed; z-index: 14; display: none; pointer-events: none; width: calc(var(--w) * var(--cell)); height: calc(var(--h) * var(--cell)); transform: translate(-50%, -50%); }
  #invCarry .ico { margin: 0 auto; filter: drop-shadow(0 4px 8px #000); }
  #invCarry .gem { display: block; margin: 9%; }
  #invTip { position: fixed; z-index: 15; display: none; pointer-events: none; max-width: 330px; padding: 9px 12px; background: rgba(8,6,4,.97); border: 1px solid var(--gold-dim); font-size: 14px; line-height: 1.42; }
  #invTip .l-title { font-size: 16px; margin-bottom: 1px; }
  #invTip .l-sub { font-size: 12.5px; opacity: .66; margin-bottom: 5px; }
  #invTip .l-gem { font-size: 13px; margin-top: 1px; }
  #invTip .l-open { font-size: 13px; opacity: .55; margin-top: 1px; }
  #invBar { display: flex; align-items: center; gap: 14px; max-width: 100%; padding: 4px 10px; background: rgba(8,6,4,.72); font-size: 12.5px; }
  #invHelp { opacity: .68; }
  #invNote { color: var(--gold); min-width: 8em; }
  #invClose { font: inherit; font-size: 12.5px; letter-spacing: .1em; padding: 5px 14px; color: var(--bone); background: transparent; border: 1px solid var(--gold-dim); cursor: pointer; flex: none; }
  #invClose:hover { background: rgba(201,163,92,.2); }
  @media (max-height: 460px) { #invBar { font-size: 10.5px; gap: 10px; } #invNote { min-width: 0; } #inv { gap: 3px; padding: 3px; } #inv .panel { padding: 4px 6px 6px; } #inv .label { margin-bottom: 3px; font-size: 10px; } #invStats { font-size: 11.5px; margin-top: 5px; } }
  body.touch #foe { background: rgba(8,6,4,.68); }
  body.touch #bleed { font-size: 14px; color: #ff6a4a; }
  body.touch #debug { top: calc(56px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); right: auto; text-align: left; font-size: 10px; }
  /* The six spell slots; the menu that fills them from all twenty. */
  #mana { height: 5px; margin-top: 3px; background: rgba(0,0,0,.6); overflow: hidden; border: 1px solid rgba(110,150,230,.4); }
  #mana > i { display: block; height: 100%; width: 100%; background: linear-gradient(180deg, #5aa4ff, #2346b8); transform-origin: 0 50%; will-change: transform; transition: transform .08s; }
  #spells { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 5px; pointer-events: auto; }
  #spells .spell { --c: #ccc; position: relative; width: 48px; height: 48px; padding: 9px; box-sizing: border-box; color: var(--c); background: rgba(8,6,4,.66); border: 1px solid rgba(201,163,92,.34); cursor: pointer; transition: box-shadow .12s, transform .12s, opacity .12s; }
  #spells .spell svg { display: block; width: 100%; height: 100%; }
  #spells .spell b { position: absolute; left: 3px; top: 1px; font-size: 11px; font-weight: 400; color: #e7dcc4; text-shadow: 0 1px 2px #000; }
  #spells .spell.now { border-color: rgba(233,200,130,.95); box-shadow: 0 0 12px -3px var(--c), inset 0 0 12px -6px var(--c); }
  #spells .spell.short { opacity: .42; filter: saturate(.3); }
  #spells .spell.empty { background: rgba(8,6,4,.3); border-style: dashed; }
  #spells .spell.up { box-shadow: 0 0 26px -2px var(--c), inset 0 0 18px -5px var(--c); transform: translateY(-3px); }
  #spellOpen { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-left: 4px; font-size: 13px; color: var(--gold); background: rgba(8,6,4,.6); border: 1px solid rgba(201,163,92,.4); cursor: pointer; }
  #spellName { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 6px; white-space: nowrap; font-size: 12px; letter-spacing: .1em; color: #e7dcc4; text-shadow: 0 1px 3px #000; }
  #softCursor { position: fixed; left: 0; top: 0; width: 16px; height: 16px; margin: -2px 0 0 -2px; display: none; z-index: 40; pointer-events: none; }
  #softCursor::before { content: ''; display: block; width: 0; height: 0; border-left: 11px solid #e7cf9a; border-bottom: 16px solid transparent; filter: drop-shadow(0 1px 2px #000); }
  #spellbook { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; padding: calc(22px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); background: rgba(5,4,3,.82); backdrop-filter: blur(5px); z-index: 30; pointer-events: auto; overflow: auto; box-sizing: border-box; }
  #spellbook.open { display: flex; }
  #spellbook h2 { margin: 0 0 12px; font-size: 18px; font-weight: 400; letter-spacing: .3em; color: var(--gold); }
  #spellGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 7px; width: min(1220px, 100%); flex: none; }
  #spellGrid .card { --c: #ccc; position: relative; display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 8px 10px; font: inherit; color: #d7cdb8; background: rgba(20,15,10,.8); border: 1px solid rgba(201,163,92,.2); cursor: pointer; }
  #spellGrid .card:hover { border-color: var(--c); background: rgba(34,26,18,.9); }
  #spellGrid .card.on { border-color: var(--c); box-shadow: inset 0 0 22px -12px var(--c); }
  #spellGrid .ic { flex: none; width: 34px; height: 34px; color: var(--c); }
  #spellGrid .ic svg { display: block; width: 100%; height: 100%; }
  #spellGrid .tx { display: flex; flex-direction: column; gap: 2px; font-size: 12px; line-height: 1.32; min-width: 0; }
  #spellGrid .tx b { font-size: 14px; font-weight: 400; letter-spacing: .05em; color: #f0e5cd; }
  #spellGrid .tx i { font-style: normal; font-size: 11px; color: var(--c); }
  #spellGrid kbd { position: absolute; top: 6px; right: 8px; font: inherit; font-size: 10px; color: #8d8370; }
  #spellClose { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: calc(18px + env(safe-area-inset-right)); padding: 6px 12px; font: inherit; color: var(--gold); background: none; border: 1px solid rgba(201,163,92,.45); cursor: pointer; }
  #bCast { width: 66px; height: 66px; right: calc(128px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); }
  /* On a touch screen the slots sit left of the thumb buttons and do the casting themselves. */
  body.touch #spells { left: 41%; bottom: calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
  body.touch #spells .spell { width: 42px; height: 42px; padding: 7px; }
  body.touch #spellOpen { width: 36px; height: 36px; }
  body.touch #bPause { bottom: auto; top: calc(6px + env(safe-area-inset-top)); }
  body.touch #bTake { bottom: calc(112px + env(safe-area-inset-bottom)); }
  #spellHint { margin: 0 0 8px; font-size: 13px; color: #cfc3a8; text-align: center; }
  #spellSlots { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; width: min(860px, 100%); margin-bottom: 12px; flex: none; }
  #spellSlots .lslot { --c: #ccc; position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 78px; padding: 8px 4px 6px; font: inherit; color: #e7dcc4; background: rgba(20,15,10,.85); border: 1px solid rgba(201,163,92,.5); cursor: pointer; }
  #spellSlots .lslot:hover { border-color: var(--gold); background: rgba(40,30,20,.95); }
  #spellSlots .lslot.empty { border-style: dashed; color: #8d8370; justify-content: center; }
  #spellSlots .lslot b { position: absolute; left: 6px; top: 3px; font-size: 13px; font-weight: 400; color: var(--gold); }
  #spellSlots .ic { width: 34px; height: 34px; color: var(--c); }
  #spellSlots .ic svg { display: block; width: 100%; height: 100%; }
  #spellSlots .nm { font-size: 11px; letter-spacing: .03em; text-align: center; line-height: 1.15; }
  #spellGrid .card.slotted { background: rgba(38,29,18,.9); }
  #spellGrid .card kbd { font-size: 13px; color: var(--gold); }
  #spellGrid .card kbd:empty { display: none; }
  #spellGhost { --c: #ccc; position: fixed; left: 0; top: 0; width: 38px; height: 38px; margin: -19px 0 0 -19px; display: none; z-index: 45; color: var(--c); pointer-events: none; filter: drop-shadow(0 2px 5px #000); }
  #spellGhost svg { display: block; width: 100%; height: 100%; }
/* The opening (src/ui/opening.js): bars, eyes, flash, her words, the cards, hold to skip. */
#opening{position:fixed;inset:0;z-index:12;pointer-events:none;font-family:"Alegreya Sans",Georgia,serif}
#opening[hidden],#opening [hidden],#opening-name-panel[hidden]{display:none!important}
#opening .op-emote{position:absolute;left:0;top:0;overflow:visible;transform-origin:0 0;filter:drop-shadow(0 0 1.2px #000d)}
#opening .em-glyph{font:900 24px Cinzel,Georgia,serif;fill:url(#em-gold);stroke:#1c1107;stroke-width:2.2px;paint-order:stroke;stroke-linejoin:round}
#opening .em-lines line{stroke:#fff1cf;stroke-width:1.5px;stroke-linecap:round}
#opening .em-lines line.ink{stroke:#1c1107;stroke-width:2.9px}
#opening [data-k="anger"] .em-lines path{fill:none;stroke:#ff5636;stroke-width:1.3px;stroke-linecap:round}
#opening .em-cloud{fill:#4a4662;stroke:#14111c;stroke-width:1.1px}
#opening .em-rain{fill:none;stroke:#aab4e8;stroke-width:1.2px;stroke-linecap:round}
#opening .em-vein-ink{fill:none;stroke:#2a0806;stroke-width:2.3px;stroke-linecap:round}
#opening .em-vein{fill:none;stroke:#e5372b;stroke-width:1.2px;stroke-linecap:round}
#opening .em-drop{fill:#cfeaff;stroke:#0f2230;stroke-width:1px}
#opening .em-shine{fill:#fff}
#opening .op-bar{position:absolute;left:0;right:0;height:10.5vh;background:#000;transition:transform .9s cubic-bezier(.6,0,.3,1)}
#opening .op-top{top:0;transform:translateY(-101%)}
#opening .op-bottom{bottom:0;transform:translateY(101%)}
#opening.bars .op-top,#opening.bars .op-bottom{transform:none}
#opening .op-eyes{position:absolute;inset:0;overflow:hidden;backdrop-filter:blur(var(--haze,0px));-webkit-backdrop-filter:blur(var(--haze,0px))}
#opening .op-eyes span{position:absolute;left:-10%;width:120%;height:calc(var(--lid,51vh) + 24vh);background:#030207;box-shadow:0 0 30px 18px #030207}
#opening .op-eyes span:first-child{top:-24vh;border-radius:0 0 50% 50% / 0 0 18% 18%}
#opening .op-eyes span:nth-child(2){bottom:-24vh;border-radius:50% 50% 0 0 / 18% 18% 0 0}
#opening .op-eyes i{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(3,2,7,var(--vig,0)) 100%)}
#opening .op-flash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 45%,#fff 0%,#f1e6ff 35%,#b98cff 100%)}
#opening .op-flash.dark{background:#000}
#opening .op-sub{position:absolute;left:50%;bottom:0.8vh;transform:translateX(-50%);width:min(1060px,94vw);text-align:center;color:#f4ecdc;text-shadow:0 2px 3px #000,0 0 12px #000a}
#opening:not(.bars) .op-sub{bottom:24vh}
#opening .op-sub b{display:block;margin-bottom:2px;font:700 12px/1 Cinzel,Georgia,serif;letter-spacing:.2em;color:var(--gold)}
#opening .op-sub b:empty{display:none}
#opening .op-sub p{margin:0;font:600 clamp(15px,1.75vw,22px)/1.2 "Alegreya Sans",Georgia,serif}
#opening .op-sub.soft p{font-style:italic;color:#e4d8f2}
#opening .op-sub.big p{font:900 clamp(28px,4vw,46px)/1.1 Cinzel,Georgia,serif;letter-spacing:.04em;color:#fff;animation:op-jolt .32s ease-out}
#opening .op-sub.caption p{font-style:italic;color:#cfc6b8;font-size:clamp(16px,1.8vw,21px)}
#opening .op-ghost{visibility:hidden}
@keyframes op-jolt{0%{transform:scale(1.18)}60%{transform:scale(.98)}100%{transform:none}}
#opening .op-title{position:absolute;left:0;right:0;top:11.6vh;text-align:center;opacity:0;color:#f4ecdc;text-shadow:0 2px 6px #000,0 0 22px #000}
#opening .op-title h1{margin:0;font:700 clamp(30px,5vw,60px)/1 "Cinzel Decorative",Cinzel,serif;letter-spacing:.08em}
#opening .op-title p{margin:8px 0 0;font:500 clamp(13px,1.4vw,17px)/1.2 Cinzel,serif;letter-spacing:.18em;color:var(--gold)}
#opening .op-title .op-class{margin-top:5px;font:600 clamp(11px,1.15vw,14px)/1 Cinzel,serif;font-variant:small-caps;letter-spacing:.32em;color:#b9a7e6}
#opening .op-title em{font-style:normal;color:#b9a7e6}
#opening .op-her{position:absolute;left:0;right:0;top:13vh;text-align:center;opacity:0;color:#f4ecdc;text-shadow:0 2px 6px #000,0 0 22px #000}
#opening .op-her h2{margin:0;font:700 clamp(24px,3.6vw,44px)/1 "Cinzel Decorative",Cinzel,serif;letter-spacing:.08em}
#opening .op-her p{margin:7px 0 0;font:500 clamp(12px,1.25vw,15px)/1.2 Cinzel,serif;letter-spacing:.18em;color:var(--gold)}
#opening .op-cast{position:absolute;left:50%;top:60vh;transform:translateX(-50%);opacity:0;transition:opacity .4s;font:600 clamp(15px,1.6vw,20px) "Alegreya Sans",serif;color:#f4ecdc;text-shadow:0 2px 3px #000,0 0 12px #000a}
#opening .op-cast kbd{display:inline-block;min-width:1.4em;margin:0 4px;padding:1px 8px;border:1px solid var(--gold);border-radius:4px;background:#0b0907c0;font:700 .95em Cinzel,serif;color:var(--gold)}
body.op-cast #bCast{visibility:visible!important}
#opening .op-quest{position:absolute;left:50%;top:15vh;transform:translateX(-50%);padding:12px 34px;opacity:0;text-align:center;background:linear-gradient(90deg,transparent,#0b0907d0 18%,#0b0907d0 82%,transparent);border-top:1px solid var(--gold-dim);border-bottom:1px solid var(--gold-dim)}
#opening .op-quest small{display:block;font:700 12px Cinzel,serif;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
#opening .op-quest span{display:block;margin-top:4px;font:600 clamp(18px,2vw,24px) "Alegreya Sans",serif;color:#f4ecdc}
#opening .op-track{position:absolute;right:18px;top:clamp(150px,22vh,230px);font:600 15px "Alegreya Sans",serif;color:#f4ecdc;text-shadow:0 1px 3px #000}
#opening .op-track:not(:empty)::before{content:"\25C6  ";color:var(--gold)}
#opening .op-skip{position:absolute;right:22px;bottom:3.4vh;font:600 13px "Alegreya Sans",serif;color:#cfc6b8;text-shadow:0 1px 2px #000;opacity:.8}
#opening .op-skip i{display:block;height:2px;margin-top:4px;background:var(--gold);transform-origin:left;transform:scaleX(var(--k,0))}
body.cinematic #hud,body.cinematic #mapMini{visibility:hidden}
/* A phone's thumbs: gone while the story holds you still, but walking out of the cave is under the bars too, so they're
   back then, with only what walks you out (src/core/opening.js storyHolds). */
body.op-held #touch,body.cinematic #touch .tbtn:not(#bSprint):not(#bJump):not(#bPause){visibility:hidden}
#opening-name-panel{position:fixed;z-index:13;bottom:1.3vh;left:50%;transform:translateX(-50%);padding:4px 10px;white-space:nowrap;background:#0b0907e8;color:#f4ecdc;border:1px solid var(--gold-dim);border-radius:4px;text-align:center;box-shadow:0 5px 22px #000a}
#opening-name-panel label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#opening-name-panel input,#opening-name-panel button{font:600 16px "Alegreya Sans",Georgia,serif;color:#f4ecdc;background:#1b1611;border:1px solid var(--gold-dim);padding:5px 9px}
body.op-handoff #cross{opacity:0;transition:none}
#opening-name-panel input{width:min(260px,56vw)}
#opening-name-panel button{cursor:pointer;margin-left:6px;color:var(--gold)}
#opening-eyes.reveal{backdrop-filter:none;background:radial-gradient(ellipse,#e5baff 0%,#9a56ef 43%,#3d1b63 100%);opacity:var(--flash,0)}
#opening-eyes.reveal span{display:none}
</style>
</head>
<body>
<canvas id="view"></canvas>

    <div id="bleed"></div>
  </div>

  <div id="take"></div>

</div>
